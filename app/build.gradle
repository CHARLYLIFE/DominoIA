
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zeusvision.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zeusvision.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}


dependencies {
    // OCR latino integrado en la APK: modelo disponible sin conexion durante la partida.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
