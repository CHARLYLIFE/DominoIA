<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Dominó 1 vs 1</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #151515;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 15px 10px 5px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        #status {
            text-align: center;
            margin: 8px 0;
            font-size: 16px;
            min-height: 22px;
        }

        #game {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 10px;
        }

        .player-area {
            text-align: center;
            margin: 10px 0;
        }

        .player-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .hand {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 72px;
        }

        .board-container {
            min-height: 150px;
            margin: 15px 0;
            padding: 15px 5px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;
            background: #222;

            overflow-x: auto;
        }

        #board {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: max-content;
        }

        .domino {
            width: 46px;
            height: 68px;

            background: #f5f5f5;
            color: #111;

            border-radius: 6px;
            border: 2px solid #111;

            display: flex;
            flex-direction: column;

            flex-shrink: 0;

            box-shadow: 0 2px 4px rgba(0,0,0,.4);

            cursor: pointer;
            user-select: none;

            transition: transform .15s;
        }

        .domino:hover {
            transform: translateY(-3px);
        }

        .domino-half {
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        .domino-half:first-child {
            border-bottom: 1px solid #555;
        }

        .hidden-domino {
            background: #333;
            color: transparent;
            cursor: default;
        }

        .hidden-domino .domino-half {
            border-color: #555;
        }

        .selected {
            transform: translateY(-10px);
            box-shadow: 0 0 0 3px #ffd54a;
        }

        .empty-board {
            color: #888;
            font-size: 15px;
        }

        #controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;

            background: #3a3a3a;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:active {
            transform: scale(.97);
        }

        #newGame {
            background: #555;
        }

        .info {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            margin-top: 8px;
        }

        @media (max-width: 500px) {
            .domino {
                width: 40px;
                height: 60px;
            }

            .domino-half {
                font-size: 19px;
            }

            .hand {
                gap: 4px;
            }

            .board-container {
                min-height: 130px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🁫 Dominó 1 vs 1</h1>
</header>

<div id="status">Preparando partida...</div>

<div id="game">

    <!-- BOT -->
    <div class="player-area">
        <div class="player-title">
            🤖 Bot — <span id="botCount">7</span> fichas
        </div>

        <div id="botHand" class="hand"></div>
    </div>

    <!-- MESA -->
    <div class="board-container">
        <div id="board">
            <div class="empty-board">La mesa está vacía</div>
        </div>
    </div>

    <!-- JUGADOR -->
    <div class="player-area">
        <div class="player-title">
            👤 Tú — <span id="playerCount">7</span> fichas
        </div>

        <div id="playerHand" class="hand"></div>
    </div>

    <div id="controls">
        <button id="newGame">Nueva partida</button>
    </div>

    <div class="info">
        Toca una ficha para jugarla.
    </div>

</div>

<script src="js/domino.js"></script>

</body>
</html>
