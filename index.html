<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Dominó 1 vs 1</title>


    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #303030 0%,
                    #171717 55%,
                    #101010 100%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow-x: hidden;
        }


        /* ==================================================
           CABECERA
        ================================================== */

        header {

            text-align: center;

            padding:
                14px
                10px
                5px;
        }


        h1 {

            margin: 0;

            font-size: 23px;

            letter-spacing: .3px;
        }


        #status {

            width: 94%;

            max-width: 650px;

            min-height: 38px;

            margin:
                7px auto
                10px;

            padding:
                9px
                12px;

            border-radius: 10px;

            background: rgba(255,255,255,.07);

            text-align: center;

            font-size: 15px;

            font-weight: bold;
        }


        /* ==================================================
           CONTENEDOR
        ================================================== */

        #game {

            width: 100%;

            max-width: 850px;

            margin: auto;

            padding:
                0
                10px
                20px;
        }


        /* ==================================================
           JUGADORES
        ================================================== */

        .player-area {

            text-align: center;

            margin:
                7px
                0
                10px;
        }


        .player-title {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding:
                6px
                12px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.07);

            font-size: 14px;

            font-weight: bold;
        }


        /* ==================================================
           MANOS
        ================================================== */

        .hand {

            display: flex;

            justify-content: center;

            align-items: flex-end;

            gap: 5px;

            min-height: 68px;

            margin-top: 7px;

            padding:
                3px
                0;
        }


        /* ==================================================
           MESA
        ================================================== */

        .board-container {

            position: relative;

            width: 100%;

            min-height: 310px;

            margin:
                12px
                0
                15px;

            padding: 18px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #17602f,
                    #0d4824
                );

            border:
                4px solid #2a2a2a;

            box-shadow:
                inset 0 0 25px rgba(0,0,0,.45),
                0 6px 18px rgba(0,0,0,.35);

            overflow: hidden;
        }


        /* decoración */

        .board-container::before {

            content: "";

            position: absolute;

            inset: 10px;

            border:
                1px solid rgba(255,255,255,.12);

            border-radius: 12px;

            pointer-events: none;
        }


        #board {

            position: relative;

            z-index: 2;

            width: 100%;

            min-height: 270px;

            display: flex;

            flex-wrap: wrap;

            align-content: center;

            justify-content: center;

            align-items: center;

            gap: 5px;

            overflow: hidden;
        }


        .empty-board {

            color:
                rgba(255,255,255,.45);

            font-size: 15px;

            text-align: center;
        }


        /* ==================================================
           FICHAS
        ================================================== */

        .domino {

            width: 42px;

            height: 68px;

            flex:
                0
                0
                auto;

            display: flex;

            flex-direction: column;

            background: #f1f1f1;

            color: #111;

            border:
                2px solid #111;

            border-radius: 6px;

            box-shadow:
                0 3px 6px
                rgba(0,0,0,.5);

            user-select: none;
        }


        .domino-half {

            width: 100%;

            height: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 19px;

            font-weight: 900;
        }


        .domino-half:first-child {

            border-bottom:
                1px solid #555;
        }


        /* ==================================================
           FICHAS DEL BOT
        ================================================== */

        .hidden-domino {

            width: 34px;

            height: 52px;

            background:
                #292929;

            border:
                2px solid #555;

            box-shadow:
                0 2px 4px
                rgba(0,0,0,.4);

            transform:
                rotate(90deg);

            margin:
                0 -3px;
        }


        .hidden-domino .domino-half {

            color: transparent;

            border-color:
                #444;
        }


        /* ==================================================
           FICHAS DEL JUGADOR
        ================================================== */

        #playerHand {

            min-height: 78px;

            padding:
                7px
                5px
                10px;
        }


        #playerHand .domino {

            cursor: pointer;

            transition:
                transform .12s,
                opacity .12s;
        }


        #playerHand .domino:active {

            transform:
                translateY(-9px);
        }


        #playerHand .disabled {

            opacity: .38;
        }


        /* ==================================================
           INFORMACIÓN
        ================================================== */

        #info {

            text-align: center;

            margin-top: 3px;

            font-size: 12px;

            color:
                rgba(255,255,255,.5);
        }


        /* ==================================================
           CONTROLES
        ================================================== */

        #controls {

            display: flex;

            justify-content: center;

            gap: 8px;

            margin-top: 12px;
        }


        button {

            border: none;

            border-radius: 10px;

            padding:
                11px
                18px;

            background:
                #3c3c3c;

            color: white;

            font-size: 14px;

            font-weight: bold;

            box-shadow:
                0 3px 7px
                rgba(0,0,0,.3);

            cursor: pointer;
        }


        button:active {

            transform:
                scale(.96);
        }


        #passButton {

            background:
                #555;
        }


        #newGame {

            background:
                #303030;
        }


        /* ==================================================
           MÓVIL
        ================================================== */

        @media (max-width: 600px) {

            #game {

                padding-left: 6px;

                padding-right: 6px;
            }


            .board-container {

                min-height: 300px;

                padding:
                    12px;
            }


            #board {

                min-height: 270px;

                gap: 4px;
            }


            .domino {

                width: 39px;

                height: 63px;
            }


            .domino-half {

                font-size: 17px;
            }


            .hidden-domino {

                width: 30px;

                height: 48px;

                margin:
                    0 -4px;
            }


            #playerHand {

                gap: 3px;
            }


            #playerHand .domino {

                width: 40px;

                height: 62px;
            }


            #controls button {

                padding:
                    10px
                    15px;
            }
        }


        @media (max-width: 380px) {

            h1 {

                font-size: 20px;
            }


            .domino {

                width: 35px;

                height: 57px;
            }


            .domino-half {

                font-size: 16px;
            }


            #playerHand .domino {

                width: 36px;

                height: 57px;
            }


            .hidden-domino {

                width: 27px;

                height: 44px;
            }
        }

    </style>

</head>


<body>


<header>

    <h1>🁫 Dominó 1 vs 1</h1>

</header>


<div id="status">
    Cargando...
</div>


<div id="game">


    <!-- ================================================
         BOT
    ================================================= -->

    <div class="player-area">

        <div class="player-title">

            🤖 Bot

            <span>
                ·
                <span id="botCount">7</span>
                fichas
            </span>

        </div>


        <div id="botHand" class="hand"></div>

    </div>



    <!-- ================================================
         MESA
    ================================================= -->

    <div class="board-container">

        <div id="board">

            <div class="empty-board">

                La mesa está vacía

            </div>

        </div>

    </div>



    <!-- ================================================
         JUGADOR
    ================================================= -->

    <div class="player-area">

        <div class="player-title">

            👤 Tú

            <span>
                ·
                <span id="playerCount">7</span>
                fichas
            </span>

        </div>


        <div
            id="playerHand"
            class="hand"
        ></div>

    </div>



    <div id="info">

        14 fichas en juego ·
        14 fichas fuera

    </div>



    <div id="controls">

        <button id="passButton">
            Pasar
        </button>


        <button id="newGame">
            Nueva partida
        </button>

    </div>


</div>



<script src="./js/domino.js?v=5"></script>


</body>

</html>
