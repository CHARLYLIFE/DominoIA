<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Dominó 1 vs 1</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #151515;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            text-align: center;
            padding: 15px 10px 5px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        #status {
            text-align: center;
            min-height: 25px;
            padding: 8px;
            font-size: 16px;
        }

        #game {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 8px;
        }

        .player-area {
            text-align: center;
            margin: 8px 0;
        }

        .player-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .hand {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 72px;
        }

        .board-container {
            width: 100%;
            min-height: 150px;
            margin: 12px 0;
            padding: 15px;

            display: flex;
            align-items: center;

            background: #222;
            border-radius: 12px;

            overflow-x: auto;
            overflow-y: hidden;
        }

        #board {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: auto;
            min-width: max-content;
        }

        .empty-board {
            color: #888;
            font-size: 14px;
            white-space: nowrap;
        }

        .domino {
            width: 46px;
            height: 68px;
            flex-shrink: 0;

            display: flex;
            flex-direction: column;

            background: #f2f2f2;
            color: #111;

            border: 2px solid #111;
            border-radius: 6px;

            box-shadow: 0 2px 5px rgba(0,0,0,.5);

            user-select: none;
        }

        .domino-half {
            height: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 21px;
            font-weight: bold;
        }

        .domino-half:first-child {
            border-bottom: 1px solid #555;
        }

        .hidden-domino {
            background: #333;
            border-color: #555;
        }

        .hidden-domino .domino-half {
            color: transparent;
            border-color: #555;
        }

        .player-tile {
            cursor: pointer;
            transition: transform .12s;
        }

        .player-tile:active {
            transform: translateY(-7px);
        }

        .player-tile.disabled {
            opacity: .45;
        }

        #controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;

            background: #444;
            color: white;

            font-size: 15px;
            font-weight: bold;
        }

        button:active {
            transform: scale(.97);
        }

        #info {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-top: 5px;
        }

        @media (max-width: 500px) {

            .domino {
                width: 40px;
                height: 60px;
            }

            .domino-half {
                font-size: 18px;
            }

            .hand {
                gap: 4px;
            }

            .board-container {
                min-height: 125px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🁫 Dominó 1 vs 1</h1>
</header>

<div id="status">Cargando...</div>

<div id="game">

    <!-- BOT -->

    <div class="player-area">

        <div class="player-title">
            🤖 Bot —
            <span id="botCount">7</span> fichas
        </div>

        <div id="botHand" class="hand"></div>

    </div>


    <!-- MESA -->

    <div class="board-container">

        <div id="board">
            <div class="empty-board">
                La mesa está vacía
            </div>
        </div>

    </div>


    <!-- JUGADOR -->

    <div class="player-area">

        <div class="player-title">
            👤 Tú —
            <span id="playerCount">7</span> fichas
        </div>

        <div id="playerHand" class="hand"></div>

    </div>


    <div id="info">
        14 fichas en juego · 14 fuera de la partida
    </div>


    <div id="controls">

        <button id="passButton">
            Pasar
        </button>

        <button id="newGame">
            Nueva partida
        </button>

    </div>

</div>


<script src="./js/domino.js?v=4"></script>

</body>
</html>
