<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dominó 1vs1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- Panel del Rival -->
        <div class="player-panel">
            <h3>Rival (Bot)</h3>
            <div id="rival-hand" class="hand-container"></div>
            <span id="rival-count">Fichas: 7</span>
        </div>

        <!-- Zona de Juego / Mesa -->
        <div id="board-container">
            <div id="table-felt">
                <div id="mesa-puntas">Esperando inicio...</div>
            </div>
        </div>

        <!-- Panel del Jugador (Tú) -->
        <div class="player-panel">
            <h3 id="player-title">Tú (CHARLY)</h3>
            <div id="player-hand" class="hand-container"></div>
            <div id="controls">
                <button id="btn-pass" class="btn" style="display:none;" onclick="pasarTurno()">Pasar</button>
            </div>
        </div>
    </div>

    <!-- Mensajes de Estado / Alertas -->
    <div id="status-msg">¡Tu turno!</div>

    <script src="game.js"></script>
</body>
</html>
